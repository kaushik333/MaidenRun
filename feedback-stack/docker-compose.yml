services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=feedback
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose — reachable only from the other containers on
    # this compose network, by service name, never from the host or outside.

  feedback-form:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/feedback
      - DEPLOYMENT_ID=${DEPLOYMENT_ID}
      - FEEDBACK_QUESTIONS_PATH=/data/feedback-questions.json
    volumes:
      # feedback-questions.json sits at the bundle root alongside this file —
      # the control plane tars it in next to docker-compose.yml (see
      # backend/app/aws/s3_bundle.py) before shipping the whole bundle to the
      # instance, so this relative path resolves the same way there as it
      # does here. For local/standalone runs: `cp feedback-questions.example.json
      # feedback-questions.json` first (gitignored, same pattern as .env).
      - ./feedback-questions.json:/data/feedback-questions.json:ro
    depends_on:
      - postgres

  feedback-dashboard:
    # The exact same image as feedback-form — SERVICE_ROLE picks which
    # routes it serves at `/` (see app/main.py), since a single process
    # can't own `/` for both the public form and the token-gated dashboard.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8002"
    environment:
      - SERVICE_ROLE=dashboard
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/feedback
      - DEPLOYMENT_ID=${DEPLOYMENT_ID}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
    depends_on:
      - postgres

volumes:
  pgdata:
