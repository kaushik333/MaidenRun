services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Runs as your host user so everything written to the ./logs and ./data
    # bind mounts stays owned by you, not root. Set UID/GID in .env if yours
    # aren't 1000 (check with `id -u` / `id -g`).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Kept in the bind-mounted ./data so the cached AWS key survives rebuilds.
      - AWS_CREDENTIALS_PATH=/app/data/credentials.json
      # So the AWS SDK finds the mounted ~/.aws below (config, credentials, SSO cache).
      - HOME=/home/maidenrun
      # Passed through explicitly — compose only uses shell vars for ${...}
      # interpolation, never injects them into the container by itself.
      - AWS_PROFILE=${AWS_PROFILE:-}
    volumes:
      - ./backend/app:/app/app
      - ./infra:/app/infra:ro
      - ./logs:/app/logs
      - ./data:/app/data
      # Opt-in: set AWS_CONFIG_DIR=~/.aws in .env to use your AWS CLI profiles
      # (incl. SSO). Unset, this mounts an empty placeholder so Docker never
      # creates a root-owned ~/.aws for users without the AWS CLI. Writable
      # because SSO refreshes its token cache in there.
      - ${AWS_CONFIG_DIR:-./infra/no-aws-config}:/home/maidenrun/.aws

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
